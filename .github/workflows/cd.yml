name: CD

on:
  push:
    branches: [master]

env:
  PROJECT_ID: fast-feet-497419
  REGION: us-central1
  SERVICE: fast-feet-api
  MIGRATION_JOB: fast-feet-api-migrate
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/fast-feet-497419/portfolio/fast-feet-api

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      migration-image: ${{ steps.meta.outputs.migration-image }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: meta
        run: |
          IMAGE_TAG=${{ env.IMAGE }}:${{ github.sha }}
          MIGRATION_IMAGE_TAG=${{ env.IMAGE }}-migration:${{ github.sha }}

          docker buildx build \
            --target runtime \
            --cache-from type=registry,ref=${{ env.IMAGE }}:buildcache \
            --cache-to   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max \
            --tag $IMAGE_TAG \
            --push \
            .

          docker buildx build \
            --target migration \
            --cache-from type=registry,ref=${{ env.IMAGE }}:buildcache \
            --tag $MIGRATION_IMAGE_TAG \
            --push \
            .

          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "migration-image=$MIGRATION_IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          gcloud run jobs deploy ${{ env.MIGRATION_JOB }} \
            --image     ${{ needs.build-and-push.outputs.migration-image }} \
            --region    ${{ env.REGION }} \
            --project   ${{ env.PROJECT_ID }} \
            --max-retries 1 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest"

          gcloud run jobs execute ${{ env.MIGRATION_JOB }} \
            --region  ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image     ${{ needs.build-and-push.outputs.image }} \
            --region    ${{ env.REGION }} \
            --project   ${{ env.PROJECT_ID }} \
            --platform  managed \
            --allow-unauthenticated \
            --port      8080 \
            --memory    512Mi \
            --cpu       1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_PRIVATE_KEY=JWT_PRIVATE_KEY:latest,JWT_PUBLIC_KEY=JWT_PUBLIC_KEY:latest,NOMINATIM_API_URL=NOMINATIM_API_URL:latest,NOMINATIM_API_USER_AGENT=NOMINATIM_API_USER_AGENT:latest"
